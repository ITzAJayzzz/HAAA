version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globaltalk_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      # Mount your Firebase service account key
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    ports:
      - "5000:5000"
    networks:
      - globaltalk

  nginx:
    image: nginx:1.25-alpine
    container_name: globaltalk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - globaltalk

networks:
  globaltalk:
    driver: bridge
